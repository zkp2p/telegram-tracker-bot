name: Deploy
run-name: Deploy ${{ github.ref_name }}${{ inputs.reason == 'reconcile' && ' (reconcile)' || '' }}

on:
  push:
    branches: [releases/prod]
  workflow_dispatch:
    inputs:
      mode:
        description: Deployment mode (peer-config-reconciler sends image)
        type: choice
        options: [image]
        default: image
      reason:
        description: Who requested the deploy (peer-config-reconciler sends reconcile)
        type: choice
        options: [manual, reconcile]
        default: manual

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  image:
    permissions:
      contents: read
      id-token: write
    uses: zkp2p/.github/.github/workflows/build-deploy-image-public.yml@55da14159305d36a9f576ad818c9b79602db8954 # main (zkp2p/.github#12)
    with:
      dockerfile: deploy/Dockerfile
      image-name: peer-telegram-tracker
      artifact-name: telegram-tracker-image
      artifact-role-arn: arn:aws:iam::411399509833:role/peer-deploy-artifacts-telegram-tracker
  deploy:
    needs: image
    permissions:
      contents: read
      id-token: write
      deployments: write
      actions: write
    uses: zkp2p/.github/.github/workflows/ssm-deploy.yml@f273ccc17c3653ca84442f08726b8f44d584914c
    with:
      mode: image
      artifact-key: ${{ needs.image.outputs.artifact-key }}
      manifest-sha256: ${{ needs.image.outputs.manifest-sha256 }}
      image-id: ${{ needs.image.outputs.image-id }}
      source-sha: ${{ github.sha }}
      allow-key-removal: false
      runner: ubuntu-latest
